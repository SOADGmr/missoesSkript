panels:
  PBVE:
    panelType:
    - static
    perm: default
    rows: 6
    title: '&aBenefícios Vip Esmeralda'
    commands:
    - PBVE
    empty: LIME_STAINED_GLASS_PANE
    item:
      '12':
        material: WHITE_STAINED_GLASS
        stack: 1
        name: §5Tapete Mágico
        lore:
        - §6Use /mc e ative uma
        - §6plataforma de vidro abaixo de
        - §6seus pés que te ajudam a voar
      '23':
        material: CHEST
        stack: 1
        name: §5Kits Exclusivos
        commands:
        - console= cp PBVEK %cp-player-name%
        lore:
        - §6Clique para visualizar
        - §6os kits disponiveis para este plano
      '24':
        material: SPAWNER
        stack: 1
        name: §5Retirar Spawners
        lore:
        - §6Permissão para retirar Mob Spawners utilizando uma
        - §bPicareta de Diamante com Toque Suave
      '29':
        material: COMPASS
        stack: 1
        name: §5Comando /back
        lore:
        - §6Comando para voltar onde o player estava
        - §6antes de realizar o ultimo teleporte e ao morrer
      '33':
        material: RED_BED
        stack: 1
        name: §540 Homes
        lore:
        - §6Limite de 40 Homes
      '42':
        material: CRYING_OBSIDIAN
        stack: 1
        name: §5Loja Vip
        lore:
        - §6Acesso a uma loja exclusiva apenas para vips
        - §6a loja contém encantamentos e itens mais baratos e raros
      '40':
        material: ORANGE_DYE
        stack: 1
        name: §5Escrever Colorido
        lore:
        - §6Use códigos de cores
        - §6no chat e em placas
        - §6para escrever colorido
      '22':
        material: NETHER_STAR
        stack: 1
        name: §5Passe Vip
        lore:
        - §6Entre no servidor mesmo quando estiver lotado
      '11':
        material: BARRIER
        stack: 1
        name: §5Limpar Inventário
        lore:
        - §6Use /clear e apague todos
        - §6os itens de seu inventário
      '14':
        material: ORANGE_SHULKER_BOX
        stack: 1
        name: §5Elevadores Coloridos
        lore:
        - §6Faça elevadores coloridos
        - §6não apenas branco
      '15':
        material: ENDER_PEARL
        stack: 1
        name: §5Teleporte Instantâneo
        lore:
        - §6Sem tempo de espera para
        - §6se teleportar usando /home, /warp, /tpa e /back
      '20':
        material: IRON_BLOCK
        stack: 1
        name: §5Condense
        lore:
        - §6Use /condense e transforme
        - §6tudo que for possivel no seu inventário
        - §6em blocos, como Minerios, Trigo, outros
      '21':
        material: CRAFTING_TABLE
        stack: 1
        name: §5Mesa de Trabalho remota
        lore:
        - §6Abra uma Mesa de Trabalho de onde estiver
        - §6Use /craft
      '30':
        material: CONDUIT
        stack: 1
        name: §5Bonus McMMO
        lore:
        - §6Suba de nivel com 2x a velocidade
        - §6padrão de McMMO
      '32':
        material: SKELETON_SKULL
        stack: 1
        name: §5Usar Cabeças de Blocos
        lore:
        - §6Use /hat com um bloco | item na mão
        - §6para colocá-lo em sua cabeça
      '41':
        material: WATER_BUCKET
        stack: 1
        name: §5No kick AFK
        lore:
        - §6Não seja kickado por ficar
        - §615 minutos parado
      '39':
        material: LAVA_BUCKET
        stack: 1
        name: §52 Tags AFK
        lore:
        - §6Player tem direito a 2 tags §7[AFK]
        - §6para utilizar na conta que quiser
        - §6A tag torna a conta imuni a Kick por Afk
      '31':
        material: TRADER_LLAMA_SPAWN_EGG
        stack: 1
        name: §5Pets Exclusivos
        commands:
        - console= cp ListarPets %cp-player-name%
        lore:
        - §6Vips tem acesso a alguns pets exclusivos, listados na /warp pets
      '19':
        material: SLIME_BLOCK
        stack: 1
        name: §5/Slime?
        lore:
        - §6Use o comando "/slime?" para encontrar uma chunk de slime
      '25':
        material: OAK_SIGN
        stack: 1
        name: §5Nickname Personalizado
        lore:
        - §6Use /nick para alterar o seu nickname no chat
      '28':
        material: GREEN_BANNER
        banner: []
        stack: 1
        name: §5Flags Especiais
        lore:
        - §6Permisao para adicionar flags especiais ao seu terreno
        - '§6Flags Especiais:'
        - §6EnterMessage
        - §eExibe uma mensagem ao entrar no terreno
        - §6ExitMessage
        - §eExibe uma mensagem ao sair do terreno
        - §6NoEnterPlayer
        - §eProibe um Player especifico de entrar no terreno
        - §6NoVineGrowth
        - §eImpede que as Vinhas crescam no terreno
      '34':
        material: NAME_TAG
        stack: 1
        name: §5Colorir nomes de Pets
        lore:
        - §6Pode dar nome aos pets usando codigos de cores
      '38':
        material: STONECUTTER
        stack: 1
        name: §5Ferramentas no Tapete
        lore:
        - §6/mc tools - Adiciona um Baú do Fim e uma Mesa de Trabalho no tapete Mágico
