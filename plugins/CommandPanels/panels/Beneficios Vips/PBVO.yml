        - §6Permissão para retirar Mob Spawners utilizando uma
        - §bPicareta de Diamante com Toque Suave
      '21':
        material: WHITE_STAINED_GLASS
        stack: 1
        name: §5Tapete Mágico
        lore:
        - §6Use /mc e ative uma
        - §6plataforma de vidro abaixo de
        - §6seus pés que te ajudam a voar
      '31':
        material: CRYING_OBSIDIAN
        stack: 1
        name: §5Loja Vip
        lore:
        - §6Acesso a uma loja exclusiva apenas para vips
        - §6a loja contém encantamentos e itens mais baratos e raros
      '20':
        material: TRADER_LLAMA_SPAWN_EGG
        stack: 1
        name: §5Pets Exclusivos
        commands:
        - console= cp ListarPets %cp-player-name%
        lore:
        - §6Vips tem acesso a alguns pets exclusivos, listados na /warp pets
      '32':
        material: RED_BED
        stack: 1
        name: §520 Homes
        lore:
        - §6Limite de 20 Homes
      '12':
        material: SKELETON_SKULL
        stack: 1
        name: §5Usar Cabeças de Blocos
        lore:
        - §6Use /hat com um bloco | item na mão
        - §6para colocá-lo em sua cabeça
      '14':
        material: BARRIER
        stack: 1
        name: §5Limpar Inventário
        lore:
        - §6Use /clear e apague todos
        - §6os itens de seu inventário
      '33':
        material: CRAFTING_TABLE
        stack: 1
        name: §5Mesa de Trabalho remota
        lore:
        - §6Abra uma Mesa de Trabalho de onde estiver
        - §6Use /craft
      '29':
        material: ENDER_PEARL
        stack: 1
        name: §5Teleporte Instantâneo
        lore:
        - §6Sem tempo de espera para
        - §6se teleportar usando /home, /warp ou /tpa
      '30':
        material: GREEN_BANNER
        banner: []
        stack: 1
        name: §5Flags Especiais
        lore:
        - §6Permisao para adicionar flags especiais ao seu terreno
        - '§6Flags Especiais:'
        - §6EnterMessage
        - §eExibe uma mensagem ao entrar no terreno
        - §6ExitMessage
        - §eExibe uma mensagem ao sair do terreno
        - §6NoEnterPlayer
        - §eProibe um Player especifico de entrar no terreno
        - §6NoVineGrowth
        - §eImpede que as Vinhas crescam no terreno
      '13':
        material: NETHER_STAR
        stack: 1
        name: §5Passe Vip
        lore:
        - §6Entre no servidor mesmo quando estiver lotado
      '39':
        material: NAME_TAG
        stack: 1
        name: §5Colorir nomes de Pets
        lore:
        - §6Pode dar nome aos pets usando codigos de cores
      '41':
        material: ORANGE_DYE
        stack: 1
        name: §5Escrever Colorido
        lore:
