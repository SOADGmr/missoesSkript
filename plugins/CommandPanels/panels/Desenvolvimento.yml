panels:
  painelStats:
    perm: default
    rows: 6
    commands:
    - ph
    title: '&8Status'
    empty: BLACK_STAINED_GLASS_PANE
    item:
      '11': # aEventos
        material: WHITE_WOOL
        stack: 1
        name: '&fEstatísticas &ea&aEventos'
        lore:
        - ' '
        - ' &7> &6Participações: &a%math_0:_{servervariables_value_aeventos_participations_total}%'
        - ' &7> &6Vitórias: &c%aeventos_wins_total%'
        - ' &7> &6Taxa de Vitórias: &7%servervariables_value_aeventos_win_tax%'
        - ' '
        - ' &7> &6Fórmula: &7(&c%aeventos_wins_total%&7*&c%aeventos_wins_total%&7)/&a%servervariables_value_aeventos_participations_total%'
        - ' '
      '12': # JobsReborn
        material: LIGHT_GRAY_WOOL
        stack: 1
        name: '&fEstatísticas &eJobs&aReborn'
        lore:
        - ' '
        - ' &7> &6Total de Levels: &a%jobsr_user_totallevels%'
        - ' &7> &6Total de Jobs: &c%jobsr_user_joinedjobcount%'
        - ' &7> &6Jobs Pontos: &7%math_0:_{servervariables_value_jobsr_user_lvl_average}%'
        - ' ' 
        - ' &7> &6Fórmula: &a%jobsr_user_totallevels%&7/&c%jobsr_user_joinedjobcount%'
        - ' '
      '13': # SimpleClans
        material: GRAY_WOOL
        stack: 1
        name: '&fEstatísticas &eSimple&aClans'
        lore:
        - ' '
        - ' &6Nome do Clan: &3%simpleclans_clan_name%'
        - ' '
        - ' &7> &6Kills Neutros: &7%simpleclans_neutral_kills%/%simpleclans_clan_total_neutral% &7(&a%math_2:_{servervariables_value_simpleclans_nkt}%&7)'
        - ' &7> &6Kills Rivais:    &7%simpleclans_rival_kills%/%simpleclans_clan_total_rival% &7(&b%math_2:_{servervariables_value_simpleclans_rkt}%&7)'
        - ' &7> &6Kills Civis:      &7%simpleclans_civilian_kills%/%simpleclans_clan_total_civilian% &7(&c%math_2:_{servervariables_value_simpleclans_ckt}%&7)'
        - ' &7> &6Kills Aliados:  &7%simpleclans_ally_kills%/%simpleclans_clan_total_ally% &7(&d%math_2:_{servervariables_value_simpleclans_akt}%&7)'
        - ' &7> &6Mortes:         &7%simpleclans_deaths%/%simpleclans_clan_total_deaths% &7(&2%math_2:_{servervariables_value_simpleclans_dt}%&7)'
        - ' '
        - ' &6TOP CLANS'
        - ' &31º - %simpleclans_topclans_1_clan_name%'
        - ' &22º - %simpleclans_topclans_2_clan_name%'
        - ' &a3º - %simpleclans_topclans_3_clan_name%'
        - ' '
        - ' &7> &6Top Bonus: &1%servervariables_value_simpleclans_top_clan_bonus%'
        - ' '
        - ' &6PONTOS DE CLAN: &e%math_2:_{servervariables_value_simpleclans_points}%'
        - ' '
        - ' &7> &6Fórmula: &7(1.5*&a%servervariables_value_simpleclans_nkt%&7)+(2*&b%servervariables_value_simpleclans_rkt%&7)+(&c%servervariables_value_simpleclans_ckt%&7*&1%servervariables_value_simpleclans_top_clan_bonus%&7)-&d%servervariables_value_simpleclans_akt%&7-&2%servervariables_value_simpleclans_dt%'
        - ' '
      '14': # MyPet
        material: BLACK_WOOL
        stack: 1
        name: '&fEstatísticas &eMy&aPet'
        lore:
        - ' '
        - ' &7> &6Level: &a%mypet_level%/100 &8(%mypet_level%%)'
        - ' &7> &6Vida: &b%mypet_health%&7/&c%mypet_health_max%'
        - ' '
        - ' &6PONTOS DE TREINADOR: &e%servervariables_value_mypet_points%'
        - ' '
        - ' &7> &6Fórmula: &a%mypet_level%&7*(&b%mypet_health%&7/&c%mypet_health_max%&7)'
        - ' '
      '15': # ExcellentCrates
        material: BROWN_WOOL
        stack: 1
        name: '&fEstatísticas &eExcellent&aCrates'
        lore:
        - ' '
        - ' &7> &6Aberturas Caixa Básica: &a%excellentcrates_openings_básica%'
        - ' &7> &6Aberturas Caixa Avançada: &b%excellentcrates_openings_avançada%'
        - ' &7> &6Aberturas Caixa Spawner: &c%excellentcrates_openings_spawners%'
        - ' &7> &6Aberturas Caixa Mensal: &d%excellentcrates_openings_mensal%'
        - ' '
        - ' &6PONTOS DE CAIXAS: &e%servervariables_value_ecrates_points%'
        - ' '
        - ' &7> &6Fórmula: &7[(1*&a%excellentcrates_openings_básica%&7)+(2*&b%excellentcrates_openings_avançada%&7)+(5*&c%excellentcrates_openings_spawners%&7)+(0.05*&d%excellentcrates_openings_mensal%&7)]/8.05'
        - ' '
      '20': #VotingPlugin
        material: RED_WOOL
        stack: 1
        name: '&fEstatísticas &eVoting&aPlugin'
        lore:
        - ' '
        - ' &7> &6Total de Votos Mensal do Servidor: &a%votingplugin_total%'
        - ' &7> &6Seu Total de Votos: &b%votingplugin_total_monthly%'
        - ' &7> &6Total de Votos do Servidor: &7%votingplugin_globalalltimetotal%'
        - ' &7> &6Posição no Top Mensal: &c%votingplugin_top_month_position%ª'
        - ' &7> &6Calculo Bruto: &7%math_({votingplugin_total_monthly}*{votingplugin_total_monthly}/{votingplugin_total})*3/15%'
        - ' '
        - ' &6PONTOS DE VOTO: &e%servervariables_value_vote_points%'
        - ' '
        - ' &7> &6Fórmula Simples: &7(&b%votingplugin_total_monthly%&7*&b%votingplugin_total_monthly%&7/&a%votingplugin_total%&7)*(3/15)'
        - ' &7> &6Fórmula Top10: &7(&b%votingplugin_total_monthly%&7*&b%votingplugin_total_monthly%&7/&a%votingplugin_total%)&7*3/&c%votingplugin_top_month_position%'
      '21': # Status
        material: ORANGE_WOOL
        stack: 1
        name: '&6STATUS &fGeral'
        lore:
        - ' '
        - ' &7> &6aEventos: &e%servervariables_value_aeventos_win_tax% '
        - ' &7> &6Jobs Reborn: &1%servervariables_value_jobsr_user_lvl_average% '
        - ' &7> &6Simple Clans: &2%servervariables_value_simpleclans_points% '
        - ' &7> &6MyPet: &3%servervariables_value_mypet_points% '
        - ' &7> &6eCrates: &4%servervariables_value_ecrates_points% '
        - ' &7> &6Vote: &5%servervariables_value_vote_points% '
        - ' &7> &6Balance: &a%vault_eco_balance% '
        - ' &7> &6SkyCoins: &b%servervariables_value_sky_coins% '
        - ' &7> &6TryMe Answers: &c%tryme_user_answers% '
        - ' &7> &6Power Level: &d%mcmmo_power_level% '
        - ' '
        - ' &61º %ajlb_lb_servervariables_value_status_1_monthly_name%: &e%ajlb_lb_servervariables_value_status_1_monthly_value%'
        - ' &62º %ajlb_lb_servervariables_value_status_2_monthly_name%: &e%ajlb_lb_servervariables_value_status_2_monthly_value%'
        - ' &63º %ajlb_lb_servervariables_value_status_3_monthly_name%: &e%ajlb_lb_servervariables_value_status_3_monthly_value%'
        - ' &64º %ajlb_lb_servervariables_value_status_4_monthly_name%: &e%ajlb_lb_servervariables_value_status_4_monthly_value%'
        - ' &65º %ajlb_lb_servervariables_value_status_5_monthly_name%: &e%ajlb_lb_servervariables_value_status_5_monthly_value%'
        - ' '
        - ' &7> &6Fórmula: &7(&a%vault_eco_balance%&7/1000)+&b%servervariables_value_sky_coins%&7+(&c%tryme_user_answers%&7*100)+(&d%mcmmo_power_level%&7*10)+(&e%servervariables_value_aeventos_win_tax%&7*100)+(&1%servervariables_value_jobsr_user_lvl_average%&7*10)+(&2%servervariables_value_simpleclans_points%&7*50)+(&3%servervariables_value_mypet_points%&7*50)+(&4%servervariables_value_ecrates_points%&7*100)+(&5%servervariables_value_vote_points%&7*1000)'
      '22':
        material: YELLOW_WOOL
        stack: 1
        name: '%autorank_total_time_of_player%'
      '23':
